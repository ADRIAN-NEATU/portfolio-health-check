[theme]
base = "light"
primaryColor = "#1F6F50"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14213D"
linkColor = "#1F6F50"
borderColor = "#E3E6EB"
dataframeBorderColor = "#E3E6EB"
dataframeHeaderBackgroundColor = "#F7F8FA"
dataframeHeaderTextColor = "#5B6475"
# System fonts only, the same as the CSS in app.py: nothing is loaded from Google.
font = "'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
